<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shop | Arudhra</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><div class="header-inner"><a class="brand" href="index-tailwind.html"><span class="brand-mark" aria-hidden="true">A</span><span>Arudhra <small class="brand-sub">ONLINE STORES</small></span></a><form class="header-search" data-product-search role="search"><label class="visually-hidden" for="shop-search">Search products</label><input id="shop-search" name="q" placeholder="Search products, brands and more" autocomplete="off"><button type="submit">Search</button></form><a class="cart-link" href="cart-tailwind.html" aria-label="Cart"><span aria-hidden="true">🛒</span> Cart <span class="cart-count" data-cart-count hidden>0</span></a></div></header><main class="page-shell"><div class="shop-layout"><aside class="filter-panel" aria-labelledby="filter-title"><h2 id="filter-title">Filter products</h2><div class="filter-group"><label for="shop-query">Search within shop</label><input id="shop-query" type="search" data-shop-query placeholder="Try headphones"></div><div class="filter-group"><label for="brand-filter">Brand</label><select id="brand-filter" data-filter-brand><option value="">All brands</option><option>Apple</option><option>Samsung</option><option>Google</option><option>ASUS</option><option>Bose</option><option>OnePlus</option></select></div><div class="filter-group"><label for="category-filter">Category</label><select id="category-filter" data-filter-category><option value="">All categories</option><option>Mobiles</option><option>Laptops</option><option>Audio</option><option>Wearables</option></select></div></aside><section aria-labelledby="shop-title"><div class="shop-toolbar"><div><h1 id="shop-title">Shop all products</h1><span class="result-count" data-result-count></span></div><label class="result-count" for="sort-products">Sort <select id="sort-products" data-sort><option value="popular">Popular</option><option value="price-low">Price: low to high</option><option value="price-high">Price: high to low</option></select></label></div><div class="product-grid" data-product-grid></div></section></div></main><script src="store-data.js"></script><script src="store-app.js"></script></body>
</html>
