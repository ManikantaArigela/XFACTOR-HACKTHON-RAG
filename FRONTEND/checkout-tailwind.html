<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkout — Arudhra (Prototype)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="index-tailwind.html" class="flex items-center gap-2">
          <div class="w-10 h-10 bg-blue-600 text-white rounded-md flex items-center justify-center font-bold">A</div>
          <span class="font-semibold">Arudhra</span>
        </a>

        <div class="flex items-center gap-4">
          <a href="cart-tailwind.html" class="flex items-center gap-2 text-slate-600 hover:text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4"></path></svg>
            <span class="hidden sm:inline">Cart</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <section class="lg:col-span-2 bg-white rounded-lg p-6 shadow-sm">
        <h2 class="font-semibold text-lg">Shipping Address</h2>
        <form class="mt-4 space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <input class="border rounded px-3 py-2" placeholder="Full name">
            <input class="border rounded px-3 py-2" placeholder="Phone number">
          </div>

          <input class="w-full border rounded px-3 py-2" placeholder="Address">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <input class="border rounded px-3 py-2" placeholder="City">
            <input class="border rounded px-3 py-2" placeholder="Pincode">
          </div>

          <div class="mt-4">
            <h3 class="font-semibold">Delivery Method</h3>
            <label class="flex items-center gap-2 mt-2"><input type="radio" name="deli" checked> Standard Delivery (2-5 days) — FREE</label>
            <label class="flex items-center gap-2 mt-1"><input type="radio" name="deli"> Express Delivery (1-2 days) — ₹199</label>
          </div>
        </form>
      </section>

      <aside class="bg-white rounded-lg p-4 shadow-sm">
        <h3 class="font-semibold">Order Summary</h3>
        <div class="mt-4 text-sm text-slate-600">
          <div class="flex justify-between"><span>iPhone 15 (128GB)</span><span>₹69,999</span></div>
          <div class="flex justify-between mt-2"><span>AirPods Pro</span><span>₹24,999</span></div>
          <div class="flex justify-between mt-2"><span>Shipping</span><span>FREE</span></div>
          <div class="flex justify-between mt-4 font-bold text-lg"><span>Total</span><span>₹96,398</span></div>

          <div class="mt-6">
            <a href="#" class="block bg-blue-600 text-white text-center px-4 py-2 rounded">Place Order</a>
          </div>
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
