<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout | Arudhra</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><div class="header-inner"><a class="brand" href="index-tailwind.html"><span class="brand-mark" aria-hidden="true">A</span><span>Arudhra <small class="brand-sub">ONLINE STORES</small></span></a><span class="brand-sub">SECURE CHECKOUT</span><a class="cart-link" href="cart-tailwind.html" aria-label="Cart"><span aria-hidden="true">🛒</span> Cart <span class="cart-count" data-cart-count hidden>0</span></a></div></header><main class="page-shell"><div class="checkout-layout"><section class="surface"><h1>Shipping address</h1><form class="form-grid" onsubmit="return false"><div class="field"><label for="full-name">Full name</label><input id="full-name" autocomplete="name" required></div><div class="field"><label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel" required></div><div class="field field-full"><label for="address">Address</label><input id="address" autocomplete="street-address" required></div><div class="field"><label for="city">City</label><input id="city" autocomplete="address-level2" required></div><div class="field"><label for="pincode">Pincode</label><input id="pincode" inputmode="numeric" autocomplete="postal-code" required></div><fieldset class="field field-full"><legend>Delivery method</legend><label class="radio-row"><input type="radio" name="delivery" checked> Standard delivery (2–5 days) · Free</label><label class="radio-row"><input type="radio" name="delivery"> Express delivery (1–2 days) · ₹199</label></fieldset></form></section><aside class="surface"><h2>Order summary</h2><div data-checkout-summary></div><button class="button" type="button" data-place-order style="width:100%;margin-top:15px">Place order</button><p class="notice" data-order-status hidden style="margin-top:14px">Thanks! Your demo order has been placed.</p></aside></div></main><script src="store-data.js"></script><script src="store-app.js"></script></body>
</html>
