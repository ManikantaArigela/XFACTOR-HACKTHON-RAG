<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arudhra Mobile Stores — Pithapuram</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="auth.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_BASE = window.ARUDHRA_API_BASE_URL || "http://127.0.0.1:5000/api";

    function App() {
      const [products, setProducts] = useState([]);
      const [searchQuery, setSearchQuery] = useState("");
      const [activeCategory, setActiveCategory] = useState("all");
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isChatOpen, setIsChatOpen] = useState(false);
      const [loading, setLoading] = useState(true);

      // User Authentication State
      const [user, setUser] = useState(() => {
        try {
          const raw = localStorage.getItem("arudhra_user");
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      });
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState("login"); // "login" or "register"
      const [authEmail, setAuthEmail] = useState("");
      const [authPassword, setAuthPassword] = useState("");
      const [authFullName, setAuthFullName] = useState("");
      const [authConfirmPassword, setAuthConfirmPassword] = useState("");
      const [authError, setAuthError] = useState("");
      const [authSuccess, setAuthSuccess] = useState("");
      const [isAuthLoading, setIsAuthLoading] = useState(false);
      const [isUserMenuOpen, setIsUserMenuOpen] = useState(false);
      const [showPassword, setShowPassword] = useState(false);

      // Buy Now & Order Form Modal State
      const [isOrderModalOpen, setIsOrderModalOpen] = useState(false);
      const [orderProduct, setOrderProduct] = useState(null);
      const [orderQty, setOrderQty] = useState(1);
      const [orderName, setOrderName] = useState("");
      const [orderPhone, setOrderPhone] = useState("");
      const [orderAddress, setOrderAddress] = useState("");
      const [orderCity, setOrderCity] = useState("Pithapuram");
      const [orderPincode, setOrderPincode] = useState("533450");
      const [orderPaymentMethod, setOrderPaymentMethod] = useState("Cash on Delivery");
      const [orderDeliveryMethod, setOrderDeliveryMethod] = useState("Standard Store Delivery");
      const [orderNotes, setOrderNotes] = useState("");
      const [isOrderSubmitting, setIsOrderSubmitting] = useState(false);
      const [orderError, setOrderError] = useState("");
      const [orderSuccessData, setOrderSuccessData] = useState(null);

      const [chatMessages, setChatMessages] = useState([
        {
          sender: "bot",
          text: user
            ? `Hello **${user.full_name || user.email}**! 👋 Welcome back to **Arudhra Mobile Stores**, Pithapuram. Ask me about active mobile deals, laptop specs, prices, or store availability!`
            : "Hello! 👋 Welcome to **Arudhra Mobile Stores**, Pithapuram. Ask me about active mobile deals, laptop specs, prices, or store availability!"
        }
      ]);
      const [chatInput, setChatInput] = useState("");
      const [isChatLoading, setIsChatLoading] = useState(false);
      const chatEndRef = useRef(null);

      // Verify token / user session on mount
      useEffect(() => {
        if (window.ArudhraAuth && window.ArudhraAuth.getToken()) {
          window.ArudhraAuth.getCurrentUser().then(verifiedUser => {
            if (verifiedUser) setUser(verifiedUser);
          });
        }
      }, []);

      useEffect(() => {
        fetchProducts(searchQuery);
      }, [searchQuery]);

      useEffect(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: "smooth" });
        }
      }, [chatMessages, isChatLoading]);

      const fetchProducts = async (q) => {
        setLoading(true);
        try {
          const endpoint = q
            ? `${API_BASE}/search?q=${encodeURIComponent(q)}&limit=100`
            : `${API_BASE}/products?limit=100`;
          const res = await fetch(endpoint);
          const data = await res.json();
          const items = q ? data.data?.results || [] : data.data?.items || [];
          setProducts(items);
        } catch (err) {
          console.error("Failed to fetch products:", err);
        } finally {
          setLoading(false);
        }
      };

      const handleAddToCart = (product) => {
        if (!user) {
          openAuthModal("login");
          setAuthError("Please sign in or create an account to add items to your cart.");
          return;
        }
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, { ...product, qty: 1 }];
        });
      };

      const removeFromCart = (id) => {
        setCart(prev => prev.filter(item => item.id !== id));
      };

      const cartTotal = cart.reduce((sum, item) => sum + (item.price || 0) * item.qty, 0);

      const filteredProducts = products.filter(p => {
        if (activeCategory === "all") return true;
        const cat = (p.category || "").toLowerCase();
        if (activeCategory === "mobile") return cat.includes("mobile") || cat.includes("smartphone");
        if (activeCategory === "laptop") return cat.includes("laptop");
        if (activeCategory === "watch") return cat.includes("watch") || cat.includes("wearable");
        return true;
      });

      // Authentication Actions
      const openAuthModal = (mode = "login") => {
        setAuthMode(mode);
        setAuthError("");
        setAuthSuccess("");
        setIsAuthModalOpen(true);
        setIsUserMenuOpen(false);
      };

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError("");
        setAuthSuccess("");
        setIsAuthLoading(true);

        try {
          if (authMode === "login") {
            const data = await window.ArudhraAuth.login(authEmail, authPassword);
            setUser(data.user);
            setAuthSuccess(`Welcome back, ${data.user.full_name || data.user.email}!`);
            setTimeout(() => {
              setIsAuthModalOpen(false);
              setAuthSuccess("");
            }, 1000);
          } else {
            if (!authFullName.trim()) {
              throw new Error("Please enter your full name.");
            }
            if (authPassword.length < 6) {
              throw new Error("Password must be at least 6 characters long.");
            }
            if (authPassword !== authConfirmPassword) {
              throw new Error("Passwords do not match. Please re-check.");
            }
            const data = await window.ArudhraAuth.register(authEmail, authPassword, authFullName);
            setUser(data.user);
            setAuthSuccess(`Account created! Welcome, ${data.user.full_name || data.user.email}!`);
            setTimeout(() => {
              setIsAuthModalOpen(false);
              setAuthSuccess("");
            }, 1200);
          }
        } catch (err) {
          setAuthError(err.message || "Authentication error occurred.");
        } finally {
          setIsAuthLoading(false);
        }
      };

      const handleLogout = async () => {
        await window.ArudhraAuth.logout();
        setUser(null);
        setCart([]);
        setIsUserMenuOpen(false);
      };

      const fillDemoCredentials = () => {
        setAuthEmail("demo@example.com");
        setAuthPassword("secret123");
        setAuthError("");
      };

      const handleBuyNow = (product) => {
        if (!user) {
          openAuthModal("login");
          setAuthError("Please sign in or create an account to purchase this item.");
          return;
        }
        setOrderProduct(product);
        setOrderQty(1);
        setOrderName(user.full_name || "");
        setOrderPhone("");
        setOrderAddress("");
        setOrderCity("Pithapuram");
        setOrderPincode("533450");
        setOrderPaymentMethod("Cash on Delivery");
        setOrderDeliveryMethod("Standard Store Delivery");
        setOrderNotes("");
        setOrderError("");
        setOrderSuccessData(null);
        setIsOrderModalOpen(true);
      };

      const handleCheckout = () => {
        if (!user) {
          openAuthModal("login");
          setAuthError("Please sign in or create an account to checkout.");
          return;
        }
        if (cart.length === 0) return;
        setOrderProduct(null); // null means full cart checkout
        setOrderQty(1);
        setOrderName(user.full_name || "");
        setOrderPhone("");
        setOrderAddress("");
        setOrderCity("Pithapuram");
        setOrderPincode("533450");
        setOrderPaymentMethod("Cash on Delivery");
        setOrderDeliveryMethod("Standard Store Delivery");
        setOrderNotes("");
        setOrderError("");
        setOrderSuccessData(null);
        setIsOrderModalOpen(true);
      };

      const handleSubmitOrder = async (e) => {
        if (e) e.preventDefault();
        if (!orderName.trim()) {
          setOrderError("Please enter your full name.");
          return;
        }
        if (!orderPhone.trim() || orderPhone.trim().length < 10) {
          setOrderError("Please enter a valid 10-digit mobile number.");
          return;
        }
        if (!orderAddress.trim()) {
          setOrderError("Please enter your delivery street address & landmark.");
          return;
        }

        setIsOrderSubmitting(true);
        setOrderError("");

        const deliveryCost = orderDeliveryMethod.includes("Express") ? 149 : 0;
        let itemsList = [];
        let subtotal = 0;

        if (orderProduct) {
          subtotal = (Number(orderProduct.price) || 0) * orderQty;
          itemsList = [
            {
              id: orderProduct.id,
              name: orderProduct.name,
              price: Number(orderProduct.price) || 0,
              qty: orderQty,
              image: orderProduct.image_path || ""
            }
          ];
        } else {
          subtotal = cartTotal;
          itemsList = cart.map(item => ({
            id: item.id,
            name: item.name,
            price: Number(item.price) || 0,
            qty: item.qty,
            image: item.image_path || ""
          }));
        }

        const totalAmount = subtotal + deliveryCost;

        const orderPayload = {
          customer_name: orderName.trim(),
          customer_phone: orderPhone.trim(),
          customer_email: user ? user.email : "",
          shipping_address: orderAddress.trim(),
          city: orderCity.trim() || "Pithapuram",
          pincode: orderPincode.trim() || "533450",
          payment_method: orderPaymentMethod,
          delivery_method: orderDeliveryMethod,
          notes: orderNotes.trim(),
          total_amount: totalAmount,
          items: itemsList
        };

        try {
          const res = await fetch("http://localhost:5000/api/orders", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${window.ArudhraAuth.getToken() || ""}`
            },
            body: JSON.stringify(orderPayload)
          });

          const data = await res.json();
          if (!res.ok || !data.success) {
            setOrderError(data.message || "Failed to place order. Please try again.");
            setIsOrderSubmitting(false);
            return;
          }

          // Save to local storage for instant sync with orders page
          try {
            const currentOrders = JSON.parse(localStorage.getItem("arudhra-orders") || "[]");
            const newLocalOrder = {
              id: data.order.order_number,
              date: new Date().toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }),
              status: "Order confirmed",
              eta: "Arriving in 2–3 days (Pithapuram Store)",
              total: data.order.total_amount,
              items: data.order.items
            };
            localStorage.setItem("arudhra-orders", JSON.stringify([newLocalOrder, ...currentOrders]));
          } catch (_e) {}

          // If this was a cart checkout, clear cart
          if (!orderProduct) {
            setCart([]);
            setIsCartOpen(false);
          }

          setOrderSuccessData(data.order);
        } catch (err) {
          setOrderError("Network error placing order. Please check if the backend API is running.");
        } finally {
          setIsOrderSubmitting(false);
        }
      };

      const handleSendMessage = async (e) => {
        if (e) e.preventDefault();
        const msg = chatInput.trim();
        if (!msg) return;

        setChatMessages(prev => [...prev, { sender: "user", text: msg }]);
        setChatInput("");
        setIsChatLoading(true);

        try {
          const historyPayload = chatMessages
            .filter(m => m.sender === "user" || m.sender === "bot")
            .slice(-8)
            .map(m => ({ role: m.sender === "user" ? "user" : "assistant", content: m.text }));

          const res = await fetch(`${API_BASE}/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg, history: historyPayload })
          });
          const data = await res.json();
          setChatMessages(prev => [
            ...prev,
            {
              sender: "bot",
              text: data.answer || "No response received.",
              products: data.products || []
            }
          ]);
        } catch (err) {
          setChatMessages(prev => [
            ...prev,
            { sender: "bot", text: "Sorry, I couldn't connect to the Arudhra store server. Please try again shortly." }
          ]);
        } finally {
          setIsChatLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* HEADER NAVIGATION */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between items-center h-16 gap-4">
                <a href="#" onClick={() => { setSearchQuery(""); setActiveCategory("all"); }} className="flex items-center gap-3">
                  <div className="w-10 h-10 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl flex items-center justify-center font-black text-xl shadow-md">A</div>
                  <div>
                    <span className="font-bold text-lg text-slate-900 block leading-tight">Arudhra Mobiles</span>
                    <span className="text-[11px] font-semibold text-blue-600 uppercase tracking-wider block">Pithapuram, AP</span>
                  </div>
                </a>

                <div className="flex-1 max-w-xl">
                  <div className="relative">
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Search Mobiles, Laptops, Specs (e.g. Motorola Edge, S24 Ultra, MacBook)..."
                      className="w-full border border-slate-200 rounded-xl pl-4 pr-10 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white bg-slate-50 transition"
                    />
                    {searchQuery && (
                      <button onClick={() => setSearchQuery("")} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">✕</button>
                    )}
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  {/* AUTH STATE BUTTON / DROPDOWN */}
                  {user ? (
                    <div className="relative">
                      <button
                        onClick={() => setIsUserMenuOpen(!isUserMenuOpen)}
                        className="bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold px-3.5 py-2 rounded-xl text-sm flex items-center gap-2.5 transition border border-slate-200 shadow-sm"
                      >
                        <div className="w-6 h-6 rounded-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white flex items-center justify-center text-xs font-black uppercase shadow-xs">
                          {(user.full_name || user.email)[0]}
                        </div>
                        <span className="hidden sm:inline font-medium max-w-[110px] truncate">{user.full_name || user.email.split('@')[0]}</span>
                        <span className="text-xs text-slate-400">▾</span>
                      </button>

                      {isUserMenuOpen && (
                        <div className="absolute right-0 mt-2 w-60 bg-white rounded-2xl shadow-xl border border-slate-100 py-2 z-50">
                          <div className="px-4 py-2.5 border-b border-slate-100">
                            <p className="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Signed in as</p>
                            <p className="text-sm font-bold text-slate-900 truncate mt-0.5">{user.full_name || "Valued Customer"}</p>
                            <p className="text-xs text-slate-500 truncate">{user.email}</p>
                          </div>
                          <a href="orders-tailwind.html" className="flex items-center gap-2.5 px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 font-medium">
                            <span>📦</span> My Orders & History
                          </a>
                          <button
                            onClick={handleLogout}
                            className="w-full text-left flex items-center gap-2.5 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 font-medium border-t border-slate-100 mt-1"
                          >
                            <span>🚪</span> Sign Out
                          </button>
                        </div>
                      )}
                    </div>
                  ) : (
                    <button
                      onClick={() => openAuthModal("login")}
                      className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold px-4 py-2 rounded-xl text-sm flex items-center gap-2 shadow-sm hover:shadow transition"
                    >
                      <span>👤</span>
                      <span className="hidden sm:inline">Sign In / Register</span>
                      <span className="sm:hidden">Sign In</span>
                    </button>
                  )}

                  {/* CART BUTTON - ONLY VISIBLE WHEN USER IS LOGGED IN */}
                  {user && (
                    <button
                      onClick={() => setIsCartOpen(true)}
                      className="relative bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-4 py-2 rounded-xl text-sm flex items-center gap-2 transition border border-slate-200"
                    >
                      <span>🛒 Cart</span>
                      {cart.length > 0 && (
                        <span className="bg-blue-600 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">
                          {cart.reduce((a, b) => a + b.qty, 0)}
                        </span>
                      )}
                    </button>
                  )}
                </div>
              </div>
            </div>
          </header>

          {/* STORE HERO SECTION */}
          <section className="bg-gradient-to-r from-blue-700 via-indigo-700 to-slate-900 text-white py-10 px-4 sm:px-6 lg:px-8">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
              <div>
                <span className="inline-block bg-white/20 backdrop-blur-md text-amber-300 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-3">Arudhra Store Official Catalog</span>
                <h1 className="text-3xl sm:text-4xl font-black tracking-tight leading-tight">Your Trusted Destination for Mobiles & Laptops</h1>
                <p className="mt-2 text-blue-100 max-w-xl text-sm">Best prices in Pithapuram & Kakinada District. 100% Genuine products with official warranty, easy EMI, and doorstep delivery!</p>
              </div>
              <div className="flex items-center gap-3 bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/20">
                <div className="text-3xl">📞</div>
                <div>
                  <div className="text-xs text-blue-200 font-medium">Store WhatsApp / Call</div>
                  <div className="font-extrabold text-lg text-amber-300">91777 75 777</div>
                </div>
              </div>
            </div>
          </section>

          {/* MAIN PRODUCT CATALOG */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
            <div className="flex items-center justify-between flex-wrap gap-4 border-b border-slate-200 pb-4">
              <div className="flex items-center gap-2 overflow-x-auto">
                <button
                  onClick={() => setActiveCategory("all")}
                  className={`px-4 py-2 rounded-xl text-sm font-bold transition ${activeCategory === "all" ? "bg-blue-600 text-white shadow-md" : "bg-white text-slate-600 border border-slate-200 hover:bg-slate-50"}`}
                >
                  All Products ({products.length})
                </button>
                <button
                  onClick={() => setActiveCategory("mobile")}
                  className={`px-4 py-2 rounded-xl text-sm font-bold transition ${activeCategory === "mobile" ? "bg-blue-600 text-white shadow-md" : "bg-white text-slate-600 border border-slate-200 hover:bg-slate-50"}`}
                >
                  📱 Mobile Phones
                </button>
                <button
                  onClick={() => setActiveCategory("laptop")}
                  className={`px-4 py-2 rounded-xl text-sm font-bold transition ${activeCategory === "laptop" ? "bg-blue-600 text-white shadow-md" : "bg-white text-slate-600 border border-slate-200 hover:bg-slate-50"}`}
                >
                  💻 Laptops
                </button>
                <button
                  onClick={() => setActiveCategory("watch")}
                  className={`px-4 py-2 rounded-xl text-sm font-bold transition ${activeCategory === "watch" ? "bg-blue-600 text-white shadow-md" : "bg-white text-slate-600 border border-slate-200 hover:bg-slate-50"}`}
                >
                  ⌚ Wearables
                </button>
              </div>

              <div className="text-sm font-medium text-slate-500">
                Showing {filteredProducts.length} items
              </div>
            </div>

            {loading ? (
              <div className="py-20 text-center text-slate-500 font-medium">
                <div className="inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
                <div>Loading catalog...</div>
              </div>
            ) : filteredProducts.length === 0 ? (
              <div className="py-20 text-center text-slate-500">
                No products found matching your search. Try another query!
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mt-6">
                {filteredProducts.map(product => {
                  const image = product.image_path || "https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=800";
                  const priceStr = product.price ? `₹${Number(product.price).toLocaleString('en-IN')}` : "Contact Store";
                  const specsStr = [product.brand, product.ram, product.storage].filter(Boolean).join(" · ");

                  return (
                    <div key={product.id} className="bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-lg transition duration-300 overflow-hidden flex flex-col justify-between group">
                      <div className="relative bg-slate-100/70 aspect-[4/3] p-4 flex items-center justify-center overflow-hidden">
                        <img src={image} alt={product.name} className="w-full h-full object-contain group-hover:scale-105 transition duration-300" />
                        <span className="absolute top-3 left-3 bg-blue-600 text-white text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-wider shadow-sm">Showcase</span>
                      </div>

                      <div className="p-4 flex-1 flex flex-col justify-between">
                        <div>
                          <div className="text-xs font-bold text-blue-600 uppercase tracking-wider">{product.brand || product.category}</div>
                          <h3 className="font-bold text-slate-900 text-base leading-snug mt-0.5">{product.name}</h3>
                          <p className="text-xs text-slate-500 mt-1 line-clamp-2">{product.description || specsStr}</p>
                          {specsStr && (
                            <div className="mt-2 text-[11px] font-semibold text-slate-600 bg-slate-100 inline-block px-2 py-1 rounded-md">
                              {specsStr}
                            </div>
                          )}
                        </div>

                        <div className="mt-4 pt-3 border-t border-slate-100 flex flex-col gap-2.5">
                          <div className="flex items-center justify-between">
                            <div className="font-extrabold text-slate-900 text-base">{priceStr}</div>
                            <span className="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-100">In Stock</span>
                          </div>
                          <div className="grid grid-cols-2 gap-2">
                            <button
                              onClick={() => handleAddToCart(product)}
                              className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-2 rounded-xl transition text-center border border-slate-200"
                            >
                              + Cart
                            </button>
                            <button
                              onClick={() => handleBuyNow(product)}
                              className="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white text-xs font-bold py-2 rounded-xl transition shadow-sm flex items-center justify-center gap-1"
                            >
                              <span>⚡</span> Buy Now
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>

              </div>
            </div>
          )}

          {/* FLOATING RAG AI SHOPPING ASSISTANT */}
          <div className="fixed bottom-5 right-5 z-50 font-sans">
            <button
              onClick={() => setIsChatOpen(!isChatOpen)}
              className="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold px-4 py-3 rounded-full shadow-2xl flex items-center gap-2.5 transition transform hover:scale-105"
            >
              <span className="text-lg">💬</span>
              <span>Ask Store AI</span>
            </button>

            {isChatOpen && (
              <div className="fixed bottom-20 right-5 w-96 max-w-[calc(100vw-2.5rem)] h-[540px] bg-white rounded-2xl shadow-2xl border border-slate-100 flex flex-col overflow-hidden">
                <div className="bg-gradient-to-r from-blue-700 via-blue-600 to-indigo-600 text-white p-3.5 flex items-center justify-between shadow-xs">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center font-bold text-sm">🤖</div>
                    <div>
                      <h3 className="font-bold text-xs">Arudhra AI Assistant</h3>
                      <p className="text-[10px] text-blue-100 flex items-center gap-1">
                        <span className="w-2 h-2 bg-emerald-400 rounded-full"></span> Store RAG Active · Pithapuram
                      </p>
                    </div>
                  </div>
                  <div className="flex items-center gap-1">
                    <button
                      onClick={() => setChatMessages([{ sender: "bot", text: "Hello! 👋 I'm your official **Arudhra Mobile Stores** AI Assistant. Ask me about specific phone prices, fast charging, specs, or availability in Pithapuram!" }])}
                      title="Clear chat"
                      className="text-white/80 hover:text-white p-1 rounded hover:bg-white/10 text-xs"
                    >
                      🔄
                    </button>
                    <button onClick={() => setIsChatOpen(false)} className="text-white/80 hover:text-white p-1 rounded hover:bg-white/10 text-xs font-bold">✕</button>
                  </div>
                </div>

                <div className="bg-slate-50 border-b border-slate-100 px-3 py-2 flex items-center gap-2 overflow-x-auto text-xs no-scrollbar">
                  {["📱 Motorola Edge 70", "✨ Redmi Note 17 Pro", "💻 MacBook Air 2026", "🎮 HP Victus 15", "🔥 iPhone 18 Pro"].map((chip, idx) => (
                    <button
                      key={idx}
                      onClick={() => { setChatInput(chip.replace(/^[^\w]+/, "").trim()); }}
                      className="bg-white border border-slate-200 text-slate-700 px-2.5 py-1 rounded-full whitespace-nowrap hover:border-blue-500 hover:text-blue-600 transition"
                    >
                      {chip}
                    </button>
                  ))}
                </div>

                <div className="flex-1 p-4 overflow-y-auto space-y-4 text-sm bg-slate-50/50">
                  {chatMessages.map((msg, index) => (
                    <div key={index} className={`flex gap-2.5 ${msg.sender === "user" ? "justify-end" : ""}`}>
                      {msg.sender === "bot" && (
                        <div className="w-7 h-7 rounded-full bg-blue-600 text-white flex-shrink-0 flex items-center justify-center text-xs font-bold">A</div>
                      )}
                      <div className={`p-3 rounded-2xl max-w-[85%] text-slate-800 ${msg.sender === "user" ? "bg-blue-600 text-white rounded-tr-none" : "bg-white border border-slate-100 rounded-tl-none shadow-sm"}`}>
                        <div dangerouslySetInnerHTML={{ __html: msg.text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>") }} />

                        {msg.products && msg.products.length > 0 && (
                          <div className="mt-2.5 pt-2 border-t border-slate-100 space-y-1.5">
                            <p className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Relevant Inventory:</p>
                            <div className="grid grid-cols-1 gap-1.5">
                              {msg.products.map((p, i) => (
                                <div key={i} className="bg-slate-50 border border-slate-200/70 hover:border-blue-400 rounded-xl p-2 flex items-center justify-between gap-2 transition group">
                                  <div className="min-w-0 flex-1">
                                    <div className="font-bold text-xs text-slate-900 truncate group-hover:text-blue-600 transition">{p.name}</div>
                                    <div className="text-[11px] font-semibold text-blue-700">
                                      {p.price ? '₹' + Number(p.price).toLocaleString('en-IN') : 'Store Deal'}
                                      {p.ram || p.storage ? <span className="text-slate-400 font-normal ml-1">({p.ram || ''}{p.ram && p.storage ? ' · ' : ''}{p.storage || ''})</span> : ''}
                                    </div>
                                  </div>
                                  <button
                                    onClick={() => {
                                      const found = products.find(prod => prod.id === p.id || prod.name === p.name);
                                      if (found) { handleBuyNow(found); } else { setSearchQuery(p.name); }
                                    }}
                                    className="bg-blue-50 hover:bg-blue-600 text-blue-600 hover:text-white px-2 py-1 rounded-lg text-[10px] font-medium transition flex-shrink-0"
                                  >
                                    Shop
                                  </button>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                  {isChatLoading && (
                    <div className="flex gap-2.5">
                      <div className="w-7 h-7 rounded-full bg-blue-600 text-white flex-shrink-0 flex items-center justify-center text-xs font-bold">A</div>
                      <div className="bg-white border p-3 rounded-2xl text-slate-400 text-xs">Searching store data...</div>
                    </div>
                  )}
                  <div ref={chatEndRef} />
                </div>

                <form onSubmit={handleSendMessage} className="p-3 bg-white border-t flex items-center gap-2">
                  <input
                    type="text"
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    placeholder="Ask about phones, laptops, deals..."
                    className="flex-1 bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                  />
                  <button type="submit" className="bg-blue-600 text-white p-2 rounded-xl font-bold">Send</button>
                </form>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
