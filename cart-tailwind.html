<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cart — Arudhra (Prototype)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <header class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="index-tailwind.html" class="flex items-center gap-2">
          <div class="w-10 h-10 bg-blue-600 text-white rounded-md flex items-center justify-center font-bold">A</div>
          <span class="font-semibold">Arudhra</span>
        </a>

        <div class="flex items-center gap-4">
          <a href="cart-tailwind.html" class="flex items-center gap-2 text-slate-600 hover:text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4"></path></svg>
            <span class="hidden sm:inline">Cart</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <section class="lg:col-span-2 bg-white rounded-lg p-4 shadow-sm">
        <h2 class="font-semibold text-lg">Your Cart (3 items)</h2>

        <ul class="mt-4 space-y-4">
          <li class="flex items-center gap-4">
            <img src="https://via.placeholder.com/120x120?text=iPhone" class="w-20 h-20 object-cover rounded">
            <div class="flex-1">
              <div class="font-medium">iPhone 15 (128GB)</div>
              <div class="text-sm text-slate-500">₹69,999</div>
            </div>
            <div class="font-semibold">₹69,999</div>
          </li>

          <li class="flex items-center gap-4">
            <img src="https://via.placeholder.com/120x120?text=AirPods" class="w-20 h-20 object-cover rounded">
            <div class="flex-1">
              <div class="font-medium">AirPods Pro (2nd Gen)</div>
              <div class="text-sm text-slate-500">₹24,999</div>
            </div>
            <div class="font-semibold">₹24,999</div>
          </li>

          <li class="flex items-center gap-4">
            <img src="https://via.placeholder.com/120x120?text=Cable" class="w-20 h-20 object-cover rounded">
            <div class="flex-1">
              <div class="font-medium">USB-C to Lightning Cable</div>
              <div class="text-sm text-slate-500">₹1,499</div>
            </div>
            <div class="font-semibold">₹1,499</div>
          </li>
        </ul>

        <div class="mt-6 flex justify-between items-center">
          <a href="shop-tailwind.html" class="text-sm text-blue-600">Continue Shopping</a>
          <a href="checkout-tailwind.html" class="bg-blue-600 text-white px-5 py-2 rounded">Proceed to Checkout</a>
        </div>
      </section>

      <aside class="bg-white rounded-lg p-4 shadow-sm">
        <h3 class="font-semibold">Order Summary</h3>
        <div class="mt-4 text-sm text-slate-600">
          <div class="flex justify-between"><span>Subtotal</span><span>₹96,398</span></div>
          <div class="flex justify-between mt-2"><span>Shipping</span><span>FREE</span></div>
          <div class="flex justify-between mt-4 font-bold"><span>Total</span><span>₹96,398</span></div>
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
